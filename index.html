<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corresponsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10161D;
    --ink-2:#161E27;
    --ink-3:#1D2733;
    --paper:#E7E3D8;
    --brass:#C69A4E;
    --teal:#5C8A80;
    --text-light:#EDEAE1;
    --text-dim:#8B93A0;
    --text-dark:#1C2229;
    --rule: rgba(230,225,210,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-light);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 80px;}

  /* ---- Departures board (favorites strip) ---- */
  .board{
    background:var(--ink-2);
    border-bottom:1px solid var(--rule);
    overflow-x:auto;
  }
  .board-inner{
    max-width:920px;margin:0 auto;
    display:flex;gap:0;
    padding:0 20px;
  }
  .board-cell{
    flex:1 0 auto;
    min-width:150px;
    padding:14px 18px;
    border-right:1px solid var(--rule);
    cursor:pointer;
    transition:background .15s ease;
  }
  .board-cell:hover{background:var(--ink-3);}
  .board-cell:first-child{padding-left:0;}
  .board-city{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:4px;
  }
  .board-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color:var(--text-light);
    font-variant-numeric: tabular-nums;
  }
  .board-add{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    padding:14px 18px;
    align-self:center;
  }

  /* ---- Header / masthead ---- */
  header{padding:44px 0 28px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-size:clamp(32px,5vw,46px);
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--text-dim);font-size:15px;max-width:56ch;line-height:1.5;}

  /* ---- Search / atlas index ---- */
  .search-row{
    display:flex;gap:10px;
    margin:28px 0 8px;
  }
  input[type=text]{
    flex:1;
    background:var(--ink-2);
    border:1px solid var(--rule);
    color:var(--text-light);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:2px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--brass);}
  button{
    background:var(--brass);
    color:var(--text-dark);
    border:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:500;
    padding:0 22px;
    border-radius:2px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.85;}
  button:disabled{opacity:.4;cursor:default;}
  .hint{font-size:12px;color:var(--text-dim);margin-bottom:36px;}

  /* ---- Dispatch (selected place) ---- */
  .dispatch{
    border-top:1px solid var(--rule);
    padding-top:32px;
    display:none;
  }
  .dispatch.active{display:block;}
  .dateline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:10px;
  }
  .place-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(28px,4.4vw,40px);
    margin:0 0 16px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    border:1px solid var(--rule);
    padding:6px 12px;
    border-radius:20px;
  }
  .chip b{color:var(--text-light);font-weight:500;}
  .summary{
    color:var(--text-light);
    line-height:1.65;
    font-size:15.5px;
    max-width:64ch;
    margin-bottom:8px;
  }
  .fav-toggle{
    background:none;
    border:1px solid var(--brass);
    color:var(--brass);
    margin-top:14px;
    padding:9px 18px;
  }
  .fav-toggle.on{background:var(--brass);color:var(--text-dark);}

  /* ---- Wire feed ---- */
  .feed-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:40px 0 6px;
    border-top:1px solid var(--rule);
    padding-top:24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .translate-btn{
    background:none;
    border:1px solid var(--teal);
    color:var(--teal);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .translate-btn:hover{background:var(--teal);color:var(--ink);}
  .translate-btn:disabled{opacity:.5;cursor:default;}
  .wire-item .orig-lang{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-right:8px;
  }
  .wire{
    position:relative;
    padding-left:20px;
  }
  .wire::before{
    content:"";
    position:absolute;left:4px;top:6px;bottom:6px;
    width:1px;background:var(--rule);
  }
  .wire-item{
    position:relative;
    padding:16px 0;
    border-bottom:1px solid var(--rule);
  }
  .wire-item::before{
    content:"";
    position:absolute;left:-20px;top:22px;
    width:7px;height:7px;border-radius:50%;
    background:var(--brass);
  }
  .wire-item a{
    color:var(--text-light);
    text-decoration:none;
    font-size:16px;
    line-height:1.4;
    display:block;
  }
  .wire-item a:hover{color:var(--brass);}
  .wire-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .state-msg{
    color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:20px 0;
  }
  .paper-note{
    background:var(--paper);
    color:var(--text-dark);
    padding:14px 16px;
    border-radius:2px;
    font-size:13px;
    line-height:1.5;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="board" id="board">
  <div class="board-inner" id="boardInner"></div>
</div>

<div class="wrap">
  <header>
    <div class="eyebrow">Módulo de lugares</div>
    <h1>Corresponsal</h1>
    <p class="sub">Escribí cualquier ciudad o lugar del mundo. Trae ficha básica y titulares de prensa local con link directo a la fuente.</p>
  </header>

  <div class="search-row">
    <input type="text" id="placeInput" placeholder="Ej: Helsinki, Kyoto, Ciudad del Cabo…" autocomplete="off">
    <button id="searchBtn">Consultar</button>
  </div>
  <div class="hint">Los favoritos de la franja superior son un placeholder — se cargan editando <code>FAVORITES</code> en el código.</div>

  <div class="dispatch" id="dispatch">
    <div class="dateline" id="dateline">—</div>
    <h2 class="place-name" id="placeName">—</h2>
    <div class="chips" id="chips"></div>
    <p class="summary" id="summary"></p>
    <button class="fav-toggle" id="favToggle">+ Fijar como favorito</button>

    <div class="feed-label" id="feedLabelRow">
      <span>Titulares recientes</span>
      <button class="translate-btn" id="translateBtn">Traducir todo</button>
    </div>
    <div class="wire" id="wire"></div>
  </div>

  <div id="stateMsg" class="state-msg"></div>
</div>

<script>
/* ============ Config: favoritos precargados (editar a mano) ============ */
const FAVORITES = [
  { name: "Montevideo", country: "Uruguay", tz: "America/Montevideo", lat: -34.9011, lon: -56.1645 },
  { name: "Lugar 2 (placeholder)", country: "", tz: "UTC", lat: 0, lon: 0 },
  { name: "Lugar 3 (placeholder)", country: "", tz: "UTC", lat: 0, lon: 0 },
];

const boardInner = document.getElementById('boardInner');
const dispatch = document.getElementById('dispatch');
const stateMsg = document.getElementById('stateMsg');

/* ============ Departures board: hora local de cada favorito ============ */
function renderBoard(){
  boardInner.innerHTML = '';
  FAVORITES.forEach(f => {
    const cell = document.createElement('div');
    cell.className = 'board-cell';
    cell.innerHTML = `<div class="board-city">${f.name}</div><div class="board-time" data-tz="${f.tz}">--:--</div>`;
    cell.addEventListener('click', () => loadPlace(f.name));
    boardInner.appendChild(cell);
  });
  updateBoardClocks();
  setInterval(updateBoardClocks, 30000);
}
function updateBoardClocks(){
  document.querySelectorAll('.board-time').forEach(el => {
    const tz = el.dataset.tz;
    try{
      el.textContent = new Intl.DateTimeFormat('es-UY', {
        hour:'2-digit', minute:'2-digit', hour12:false, timeZone: tz
      }).format(new Date());
    }catch(e){ el.textContent = '--:--'; }
  });
}
renderBoard();

/* ============ Buscador ============ */
document.getElementById('searchBtn').addEventListener('click', () => {
  const q = document.getElementById('placeInput').value.trim();
  if(q) loadPlace(q);
});
document.getElementById('placeInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('searchBtn').click();
});

// Convierte el nombre de un lugar en una consulta apta para GDELT:
// saca guiones/rayas (que GDELT interpreta mal) y arma frase exacta si tiene varias palabras.
function buildNewsQuery(name){
  const clean = name.replace(/[-–—_]/g, ' ').replace(/\s+/g, ' ').trim();
  return clean.includes(' ') ? `"${clean}"` : clean;
}

async function loadPlace(query){
  stateMsg.textContent = 'Buscando…';
  dispatch.classList.remove('active');
  document.getElementById('placeInput').value = query;

  try{
    // 1. Geocoding
    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q=${encodeURIComponent(query)}`);
    const geo = await geoRes.json();
    if(!geo.length){ stateMsg.textContent = 'No encontré ese lugar. Probá con otro nombre.'; return; }
    const place = geo[0];
    const displayName = place.display_name.split(',')[0];
    const country = place.display_name.split(',').pop().trim();

    // 2. Ficha básica (Wikipedia ES, con fallback EN)
    let summary = '';
    try{
      const wikiRes = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(displayName)}`);
      if(wikiRes.ok){
        const wiki = await wikiRes.json();
        summary = wiki.extract || '';
      }
    }catch(e){}

    // 3. Titulares (GDELT)
    let articles = [];
    try{
      const newsQuery = buildNewsQuery(displayName);
      const gdeltRes = await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=${encodeURIComponent(newsQuery)}&mode=artlist&maxrecords=8&sort=datedesc&format=json`);
      if(gdeltRes.ok){
        const gdelt = await gdeltRes.json();
        articles = gdelt.articles || [];
      }
    }catch(e){}

    renderDispatch({ displayName, country, lat: place.lat, lon: place.lon, summary, articles, query });
    stateMsg.textContent = '';
  }catch(err){
    stateMsg.textContent = 'Error al traer los datos. Revisá la conexión e intentá de nuevo.';
    console.error(err);
  }
}

function renderDispatch({displayName, country, lat, lon, summary, articles, query}){
  document.getElementById('dateline').textContent =
    `${displayName.toUpperCase()} — ${new Date().toLocaleDateString('es-UY',{day:'2-digit',month:'short',year:'numeric'})}`;
  document.getElementById('placeName').textContent = displayName;

  const chips = document.getElementById('chips');
  chips.innerHTML = `
    <span class="chip"><b>País</b> ${country}</span>
    <span class="chip"><b>Coordenadas</b> ${parseFloat(lat).toFixed(2)}, ${parseFloat(lon).toFixed(2)}</span>
  `;

  document.getElementById('summary').textContent = summary || 'No se encontró resumen para este lugar.';

  const favBtn = document.getElementById('favToggle');
  favBtn.textContent = '+ Fijar como favorito';
  favBtn.classList.remove('on');
  favBtn.onclick = () => {
    favBtn.classList.toggle('on');
    favBtn.textContent = favBtn.classList.contains('on') ? '✓ Fijado (agregalo a FAVORITES en el código)' : '+ Fijar como favorito';
  };

  currentArticles = articles;
  translated = false;
  const btn = document.getElementById('translateBtn');
  btn.textContent = 'Traducir todo';
  btn.disabled = !articles.length;
  renderWire(false);

  dispatch.classList.add('active');
}

/* ============ Wire feed: original vs traducido ============ */
let currentArticles = [];
let translated = false;

function renderWire(useTranslated){
  const wire = document.getElementById('wire');
  wire.innerHTML = '';
  if(!currentArticles.length){
    wire.innerHTML = '<div class="state-msg">No se encontraron titulares recientes para este lugar.</div>';
    return;
  }
  currentArticles.forEach(a => {
    const title = useTranslated && a._translated ? a._translated : a.title;
    const item = document.createElement('div');
    item.className = 'wire-item';
    item.innerHTML = `
      <a href="${a.url}" target="_blank" rel="noopener">${title}</a>
      <div class="wire-meta">${a.domain || ''} · ${a.language || ''} · ${(a.seendate||'').slice(0,8)}</div>
    `;
    wire.appendChild(item);
  });
}

// Traducción vía MyMemory (gratis, sin API key, CORS habilitado) — para prototipo.
// Límite: ~500 caracteres por pedido y tope de uso diario por IP. Para uso intensivo
// conviene pasar a DeepL o Google Cloud Translation con clave propia.
async function translateText(text, targetLang='es'){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${targetLang}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('translate request failed');
  const data = await res.json();
  return data?.responseData?.translatedText || text;
}

document.getElementById('translateBtn').addEventListener('click', async () => {
  const btn = document.getElementById('translateBtn');
  if(translated){
    translated = false;
    btn.textContent = 'Traducir todo';
    renderWire(false);
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Traduciendo…';
  try{
    await Promise.all(currentArticles.map(async a => {
      if(!a._translated){
        try{ a._translated = await translateText(a.title, 'es'); }
        catch(e){ a._translated = a.title; }
      }
    }));
    translated = true;
    btn.textContent = 'Ver original';
    renderWire(true);
  }catch(e){
    console.error(e);
    stateMsg.textContent = 'No se pudo traducir en este momento.';
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
